# Port of the former .gitlab-ci.yml: test -> build and push image (main) -> manual deploy.
#
# Repository settings -> Secrets and variables -> Actions:
#   secrets:   DOCKERHUB_LOGIN, DOCKERHUB_PASSWORD, SSH_PRIVATE_KEY, SSH_REMOTE_HOST
#   variables: DOCKERHUB_USER, DEPLOY_PATH (optional, default /root/projects/recommendation-system)
# Deploy: Actions -> CI/CD -> Run workflow on main with "deploy" checked.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the image to the server after the build
        type: boolean
        default: false

permissions:
  contents: read

env:
  SERVICE: catalog-service
  IMAGE: ${{ vars.DOCKERHUB_USER }}/hackathon-recommendation-system-catalog-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Integration tests start Postgres with Testcontainers on the runner's Docker.
      - run: mvn -B -ntp verify

  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - name: Pull the new image and restart the service
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_REMOTE_HOST: ${{ secrets.SSH_REMOTE_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/projects/recommendation-system' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=no root@"$SSH_REMOTE_HOST" \
            "cd $DEPLOY_PATH && docker compose pull $SERVICE && docker compose up -d $SERVICE"
